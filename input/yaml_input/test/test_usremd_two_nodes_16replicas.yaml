##################################################################
# Comment:
# US-REMD test configuration for a two-node run.
# Target nodes: t38cn016 and t38cn018
# Requested resources: 2 nodes, 4 GPUs per node
# Replica layout: 16 total replicas / windows (~2 replicas per GPU)
##################################################################
tag: test_usremd_2nodes_16replicas5
test: True

cluster:
  exclude_ranks: []

system:
  pdb: ~/master_project/input/pdb_files/1sfi/1sfi_cleaned.pdb
  output_prefix: ~/mp_results/
  name: 1sfi
  ligand_residues: 224-237
  protein_residues: 1-223

setup:
  setup: True
  setup_type: cluster

methods:
  us_remd:
    name: "us_remd"
    ngpu: 4
    nodes: 2
    nodelist: [t38cn016, t38cn021]
    # partition: "barracuda"
    # constraint: "rtx4090|rtx5090|rtx2080ti"
    continuation:
      enabled: True
      source_tag: rep0_150ns
      source_method: us
    nstlim: 250
    numexchg: 30
    d: [0.00]
    e: [1.00]
    us_remd_intervals:
      - windows: [15.50, 16.00, 16.50, 17.00, 17.50, 18.00, 18.50, 19.00, 20.00, 20.50, 21.00, 21.50, 22.00, 22.50, 23.00, 23.50]
        kappas: [12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00]
