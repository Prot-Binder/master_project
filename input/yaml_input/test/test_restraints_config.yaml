tag: test_restraints_config
test: True

cluster:
  exclude_ranks: []

system:
  pdb: input/pdb_files/5h5q/5h5q_cleaned.pdb
  output_prefix: ./tmp_results
  name: testing
  ligand_residues: 166-178
  protein_residues: 1-164

setup:
  setup: False
  setup_type: cluster

restraints:
  systems:
    complex:
      pdb: input/pdb_files/5h5q/5h5q_cleaned.pdb
      receptor_residues: 1-164
      ligand_residues: 166-178
    receptor:
      pdb: input/pdb_files/1sfi/1sfi_cleaned.pdb
      receptor_residues: 1-247
    ligand:
      pdb: input/pdb_files/2nwn/2nwn_cleaned.pdb
      ligand_residues: 166-178

  lrmsd:
    class: complex
    restraint_file: _l.r
    nstlim: 500000
    kappa:
      - 10.0
      - 20.0

  rrmsd:
    class: complex
    restraint_file: _lr.r
    kappa:
      - 15.0
      - 25.0

  lB:
    class: ligand
    restraint_file: _lB.r
    kappa:
      - 15.0
      - 25.0

  rB:
    class: receptor
    restraint_file: _rB.r
    kappa:
      - 15.0
      - 25.0
