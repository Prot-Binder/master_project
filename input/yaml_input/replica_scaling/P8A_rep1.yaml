##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# some short pull simulations to get a rough estimate of the PMF. I.e. how steep it is.
##################################################################
tag: p8a_rep1_long
test: False

cluster:
  exclude_ranks: [ t38cn028,t38cn015,t38cn024,t38cn027,t38cn020,t38cn032,t38cn022,t38cn026,t38cn031,t38cn030,t38cn036]

system:
  pdb: ~/master_project/input/pdb_files/1sfi_P8A/1sfi_P8A.pdb
  output_prefix: ~/mp_results/
  name: scaling_test
  ligand_residues: 224-237
  protein_residues: 1-223
  bond: 224.N-237.C
  box_size: 22.0

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster

methods:
  eq:
    name: "eq"
    d: [ 0.200 ]
    e: [ 0.900 ]
    execute: True
    use_cpu: False
    nstlim: 250000
  pull:
    name: "pull"
    nstlim: 1350000
    mode: "serial"
    d: [ 0.200 ]
    e: [ 0.900 ]
    stride: 5
    pull_intervals:
      - start: 15.50
        end: 25.50
        step: 1.00
        k: 4.0
