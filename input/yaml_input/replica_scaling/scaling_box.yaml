##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# this is just an input file to find a decent size for the box to
# run a quick simulation e.g. only pull 10A not 20
##################################################################
tag: 6d3y_box_size3
test: False

cluster:
  exclude_ranks: [ t38cn031,t38cn030 ] # [t38cn035,t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045,t38cn049]

system:
  pdb: ~/cluster/master_project/input/pdb_files/6d3y/6d3y.pdb
  output_prefix: ~/cluster/mp_results/
  name: scaling_test
  ligand_residues: 248-261
  protein_residues: 1-247
  box_size: 40.0 # in Angstrom

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  # setup_dir: ~/mp_results/scaling_test/6d3y_rep2/eq/setup
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster

methods:
  eq:
    name: "eq"
    d: [ 0.280 ]
    e: [ 0.860 ]
    execute: True
    use_cpu: True
    nstlim: 250000
  pull:
    name: "pull"
    nstlim: 350000
    mode: "serial"
    d: [ 0.280 ]
    e: [ 0.860 ]
    stride: 5
    pull_intervals:
      - start: 17.00
        end: 20.75
        step: 0.75
        k: 4.0
      - start: 24.50
        end: 26.00
        step: 0.75
        k: 4.0
