##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# K5A simulation scaled PMF based on previous scaling studies.
# We selected d = 0.200 and e = 0.820 for this run.
# We first perform pulling and subsequently perform US-REMD.
##################################################################
tag: scaled_rep_d200_e820
test: False

cluster:
  exclude_ranks: [ t38cn028,t38cn015,t38cn024,t38cn027,t38cn020,t38cn032,t38cn022,t38cn026,t38cn031,t38cn030,t38cn036]

system:
  pdb: ~/master_project/input/pdb_files/1sfi_K5A/1sfi_K5A.pdb
  output_prefix: ~/mp_results/
  name: K5A
  ligand_residues: 224-237
  protein_residues: 1-223
  bond: 224.N-237.C

setup:
  setup: True
  setup_type: cluster

methods:
  eq:
    name: "eq"
    d: [ 0.200 ]
    e: [ 0.820 ]
    execute: True
    use_cpu: False
    nstlim: 250000

  pull:
    name: "pull"
    nstlim: 350000
    mode: "serial"
    d: [ 0.200 ]
    e: [ 0.820 ]
    stride: 5
    pull_intervals:
      - start: 15.50
        end: 23.00
        step: 0.50
        k: 8.0
      - start: 23.50
        end: 37.00
        step: 0.75
        k: 4.0

  us:
    name: "us"
    nstlim: 12500000
    d: [ 0.200 ]
    e: [ 0.820 ]
    us_intervals:
      - start: 26.50
        end: 37.00
        step: 0.75
        k: 4.0

  us_remd:
    name: "us_remd"
    ngpu: 4
    constraint: "rtx4090|rtxa5000|rtx5090"
    nstlim: 250
    numexchg: 50000
    d: [ 0.200 ]
    e: [ 0.820 ]
    us_remd_intervals:
      - windows: [ 15.50, 16.00, 16.50, 17.00, 17.50, 18.00, 18.50, 19.00, 19.50, 20.00, 20.50, 21.00, 21.50, 22.00, 22.50, 23.00, 23.50, 24.25, 25.00, 25.75 ] #, 26.50, 27.25, 28.00, 28.75, 29.50, 30.25, 31.00, 31.75, 32.50, 33.25, 34.00, 34.75, 35.00]
        kappas: [ 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 08.00, 04.00, 04.00, 04.00, 04.00 ] #, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00]
