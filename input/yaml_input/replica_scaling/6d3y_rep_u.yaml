##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# some short pull simulations to get a rough estimate of the PMF. I.e. how steep it is.
# We will run a pull simulation on a scaled replica with d = 0.360, e = 0.780
##################################################################
tag: 6d3y_repU
test: False

cluster:
  exclude_ranks: [t38cn035,t38cn030,t38cn028,t38cn015,t38cn024,t38cn027,t38cn031,t38cn020,t38cn032,t38cn022,t38cn026,t38cn036]

system:
  pdb: ~/master_project/input/pdb_files/6d3y/6d3y.pdb
  output_prefix: ~/mp_results/
  name: scaling_test
  ligand_residues: 248-261
  protein_residues: 1-247
  box_size: 22.0

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  # setup_dir: ~/mp_results/scaling_test/6d3y_rep5/eq/setup
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster

methods:
  eq:
    name: "eq"
    d: [ 0.000 ]
    e: [ 1.000 ]
    execute: True
    use_cpu: True
    nstlim: 250000
  pull:
    name: "pull"
    nstlim: 1350000
    mode: "serial"
    d: [ 0.000 ]
    e: [ 1.000 ]
    stride: 5
    pull_intervals:
      - start: 17.00
        end: 20.75
        step: 0.75
        k: 4.0
      - start: 24.50
        end: 26.00
        step: 0.75
        k: 4.0