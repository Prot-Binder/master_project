##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# some short pull simulations to get a rough estimate of the PMF. I.e. how steep it is.
# here we like to compute the unscaled PMF as well to compare if the binding pose of the ligand
# is distorted a lot by larger scaling.
#
# mow we try to reduce the d scaling and increase the e scaling to see if we can get a better estimate of the PMF. I.e. how steep it is.
# now we use some longer pull simulations and also pull longer. However, we use a smaller box.
# The overall idea is to get a reasonable estimate for the PMF, so that we do not overscale.
##################################################################
tag: 6d3z_rep1
test: False

cluster:
  exclude_ranks: [ t38cn028,t38cn015,t38cn024,t38cn027,t38cn020,t38cn032,t38cn022,t38cn026]

system:
  pdb: ~/master_project/input/pdb_files/6d3z/6d3z.pdb
  output_prefix: ~/mp_results/
  name: 6d3z
  ligand_residues: 247-260
  protein_residues: 1-246
  box_size: 22.0

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  # setup_dir: ~/mp_results/scaling_test/6d3y_rep3/eq/setup
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster

methods:
  eq:
    name: "eq"
    d: [ 0.200 ]
    e: [ 0.860 ]
    execute: True
    use_cpu: True
    nstlim: 250000
  pull:
    name: "pull"
    nstlim: 1350000
    mode: "serial"
    d: [ 0.200 ]
    e: [ 0.860 ]
    stride: 5
    pull_intervals:
      - start: 17.00
        end: 27.00
        step: 1.0
        k: 4.0