##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# running rsremd for 100 ns. Starting from unscaled structure.
# we observed that blocked convergence may be better with 16 replicas
# in some cases.
##################################################################
tag: rep_scaled_rsremd
test: False

cluster:
  exclude_ranks: [t38cn036,t38cn035,t38cn030,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn026]

system:
  pdb: ~/master_project/input/pdb_files/6d3x/6d3x.pdb
  output_prefix: ~/mp_results/
  name: 6d3x
  ligand_residues: 247-260
  protein_residues: 1-246

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  eq:
    name: "eq"
    d: [ 0.000 ]
    e: [ 1.00 ]
    execute: True
    use_cpu: True
    nstlim: 250000

  rs_remd:
    name: "rs_remd"
    n_rep: 16
    ngpu: 4
    constraint: "rtx4090|rtxa5000|rtx5090"
    eq_replica: 1
    nstlim_eq: 250000
    # nstlim_eq_each: 250000
    nstlim: 250
    numexchg: 100000
    d: [ 0.000, 0.015, 0.030, 0.045, 0.060, 0.075, 0.090, 0.105, 0.120, 0.135, 0.150, 0.165, 0.180, 0.195, 0.210, 0.225 ]
    e: [ 1.000, 0.987, 0.973, 0.960, 0.947, 0.933, 0.920, 0.907, 0.893, 0.880, 0.867, 0.853, 0.840, 0.827, 0.813, 0.800 ]
    k: 8.0
