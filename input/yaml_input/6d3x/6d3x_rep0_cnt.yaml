##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# We like to perform US on an uscaled replica of the 6d3x system.
##################################################################
tag: rep0_us
test: False

cluster:
  exclude_ranks: [t38cn035,t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045,t38cn049]

system:
  pdb: ~/master_project/input/pdb_files/6d3x/6d3x.pdb
  output_prefix: ~/mp_results/
  name: 6d3x
  ligand_residues: 247-260
  protein_residues: 1-246

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  pull:
    name: "pull"
    d: [0.000]
    e: [1.00]
    mode: "serial"
    stride: 1
    nstlim: 250000
    pull_intervals:
    - start: 20.00
      end: 20.75
      step: 0.25
      k: 24.0
  us_remd:
    name: "us_remd"
    ngpu: 4
    # partition: "barracuda"
    constraint: "rtx4090|rtx5090|rtxa5000"
    # nodelist: "t38cn037"
    # Optional continuation from a previous tag.
    # If source_method is omitted, it defaults to the current method: us_remd.
    nstlim: 250
    numexchg: 40000
    d: [ 0.000 ]
    e: [ 1.000 ]
    us_remd_intervals:
      - windows: [16.50, 17.00, 17.50, 18.00, 18.50, 19.00, 19.50, 20.00, 20.25, 20.50, 20.75, 21.00, 21.50, 22.00, 22.50, 23.00, 23.50, 24.00, 24.50, 25.00]
        kappas: [ 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 24.00, 24.00, 24.00, 24.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00 ]


