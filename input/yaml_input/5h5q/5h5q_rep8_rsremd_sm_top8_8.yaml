##################################################################
# Comment:
# RS-REMD for 5h5q with rep8 scaling. The com distance is calculated
# from scaled equilibrated structure. We now use a smaller box.
# we use 8 replicas in total and the force constant we used in usremd simulation.
##################################################################
tag: rep8_rsremd_sm_top8_8_n
test: False

cluster:
  exclude_ranks: [t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn026]

system:
  pdb: ~/master_project/input/pdb_files/5h5q/5h5q_cleaned.pdb
  output_prefix: ~/mp_results/
  name: 5h5q
  ligand_residues: 165-177
  protein_residues: 1-164
  box_size: 12.5
setup:
  setup: True
  setup_type: cluster

methods:
  eq:
    name: "eq"
    d: [0.200]
    e: [0.900]
    execute: True
    use_cpu: True
    nstlim: 250000
    # Optional additional eq-stage mdin_eq runtime if templates/eq/mdin_eq is present.

  rs_remd:
    name: "rs_remd"
    n_rep: 8
    ngpu: 2

    constraint: "rtx4090|rtxa5000|rtx5090"

    eq_replica: 8

    nstlim_eq: 250000
    # nstlim_eq_each: 250000
    nstlim: 250
    numexchg: 100000
    d: [ 0.000, 0.029, 0.057, 0.086, 0.114, 0.143, 0.171, 0.200 ]
    e: [ 1.000, 0.986, 0.971, 0.957, 0.943, 0.929, 0.914, 0.900 ]
    k: 12.0