methods:
  eq:
    name: "eq"
    d: [0.00]
    e: [1.00]
    execute: True
    use_cpu: True
    nstlim: 250000
  pull:
    name: "pull"
    d: [ 0.00 ]
    e: [ 1.00 ]
    mode: "serial"
    stride: 3
    nstlim: 250000
    pull_intervals:
    - start: 20.00
      end: 25.10
      step: 0.3
      k: 20.0
    - start: 25.25
      end: 39.50
      step: 0.75
      k: 4.0

