tag: rep0_test1
test: False

cluster:
  exclude_ranks: [] #  [t38cn035,t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn026,t38cn045,t38cn049]

system:
  pdb: ~/cluster/master_project/input/pdb_files/5h5q/5h5q_cleaned.pdb
  output_prefix: ~/cluster/mp_results/
  name: 5h5q
  ligand_residues: 165-177
  protein_residues: 1-164
  # bond: "377.N-390.C"

setup:
  setup: False # TODO: think of deleting this filed as it may be redundant
  setup_dir: ~/cluster/mp_results/5h5q/rep0_pull/us_remd/setup
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  us_remd:
    name: "us_remd"
    ngpu: 1
    # partition: "barracuda"
    # constraint: "rtx5090"
    nstlim: 250
    numexchg: 40000
    continuation:
      enabled: True
      source_tag: rep0_pull_rst_3
      source_method: us_remd  # or us_remd
    d: [ 0.00 ]
    e: [ 1.00 ]
    us_remd_intervals:
      - windows: [21.20, 21.50, 21.80, 22.10, 22.40, 22.70, 22.85, 23.00, 23.30, 23.60, 23.90, 24.20, 24.35, 24.50, 24.80, 24.95]
        kappas: [ 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00]



