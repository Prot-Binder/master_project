##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# running creating PMF and rs-remd for rep10, i.e. d = .28; e = 0.86;
# we like to show which value do we get for stronger scaling; compared to
# rep4 and rep8
##################################################################
tag: rep8
test: False

cluster:
  exclude_ranks: [t38cn035,t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045,t38cn042]

system:
  pdb: ~/master_project/input/pdb_files/5h5q/5h5q_cleaned.pdb
  output_prefix: ~/mp_results/
  name: 5h5q
  ligand_residues: 165-177
  protein_residues: 1-164
  # bond: "377.N-390.C"

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  eq:
    name: "eq"
    d: [0.28]
    e: [0.86]
    execute: True
    use_cpu: True
    nstlim: 250000
  pull:
    name: "pull"
    d: [0.28]
    e: [0.86]
    mode: "serial"
    stride: 1
    nstlim: 250000
    pull_intervals:
    - start: 19.00
      end: 24.50
      step: 0.50
      k: 12.0
    - start: 24.75
      end: 40.75
      step: 0.75
      k: 4.0

  us_remd:
    name: "us_remd"
    ngpu: 4
    # partition: "barracuda"
    constraint: "rtx4090|rtx5090|rtx2080ti"
    nstlim: 250
    numexchg: 40000
    d: [ 0.200 ]
    e: [ 0.900 ]
    us_remd_intervals:
      - windows: [21.00, 21.50, 22.00, 22.50, 23.00, 23.50, 24.00, 24.50, 24.75, 25.50, 26.25, 27.00, 27.75, 28.50, 29.25, 30.00, 30.75, 31.50, 32.25, 33.00]
        kappas: [ 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00 ]

  us:
    name: "us"
    nstlim: 12500000000
    d: [ 0.200 ]
    e: [ 0.900 ]
    us_intervals:
      - start: 19.00
        end: 20.50
        step: 0.50
        k: 12.00
      - start: 33.75
        end: 40.75
        step: 0.75
        k: 4.0

