##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# running us-remd for the 5xco system. From 22.50 to 27.00 using
# a spacing of 0.25 and force constant k = 24.
##################################################################
tag: rep0_usremd_k24
test: False

cluster:
  exclude_ranks: [t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045,t38cn054]

system:
  pdb: ~/master_project/input/pdb_files/5xco/5xco.pdb
  output_prefix: ~/mp_results/
  name: 5xco
  ligand_residues: 171-190
  protein_residues: 1-170

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  pull:
    name: "pull"
    d: [0.000]
    e: [1.00]
    mode: "serial"
    stride: 1
    nstlim: 125000
    pull_intervals:
    - start: 21.50
      end: 25.75
      step: 0.25
      k: 24.0
  us_remd:
    name: "us_remd"
    ngpu: 3
    # ngpu: 1
    # partition: "barracuda"
    nodelist: "t38cn036"
    # Optional continuation from a previous tag.
    # If source_method is omitted, it defaults to the current method: us_remd.
    nstlim: 250
    numexchg: 30000
    d: [0.00]
    e: [1.00]
    us_remd_intervals:
      - start: 21.50
        end: 25.75
        step: 0.25
        k: 24.0



