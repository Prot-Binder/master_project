##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# running rs-remd for the 5h5q system with 8 replicas; scaling of d = ; and e = ;
# the goal is to verify the rs-remd contribution as this was buggy in previous runs.
##################################################################
tag: rs_remd_rep8
test: True

cluster:
  exclude_ranks: [] # [t38cn035,t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045,t38cn042]

system:
  pdb: ~/cluster/master_project/input/pdb_files/5h5q/5h5q_cleaned.pdb
  # pdb: ~/master_project/input/pdb_files/5h5s/5h5s_cleaned.pdb
  # pdb: input/pdb_files/5h5s/5h5s_cleaned.pdb
  output_prefix: ~/cluster/mp_results/
  name: 5h5q
  ligand_residues: 166-178
  protein_residues: 1-164
  # bond: "377.N-390.C"


setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: local # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  eq:
    name: "eq"
    d: 0.20
    e: 0.90
    execute: True
    use_cpu: True
    nstlim: 250000

  rs_remd:
    name: rs_remd
    n_rep: 8
    ngpu: 1
    nstlim_eq: 500000
    nstlim: 250
    numexchg: 20000
    d: [0.00 0.0133 0.0266 0.0399 0.0532 0.0665 0.0798 0.0931 0.106 0.120 0.133 0.146 0.156 0.173 0.186 0.20]
    e: [1.00 0.993 0.987 0.980 0.973 0.967 0.960 0.953 0.946 0.940 0.933 0.926 0.920 0.913 0.906 0.90]
    k: 24.0
