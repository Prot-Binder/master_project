tag: test_multi_k
test: True

cluster:
  exclude_ranks: [t38cn035,t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045,t38cn042]

system:
  pdb: ~/cluster/master_project/input/pdb_files/5h5s/5h5s_cleaned.pdb
  # pdb: ~/master_project/input/pdb_files/5h5s/5h5s_cleaned.pdb
  # pdb: input/pdb_files/5h5s/5h5s_cleaned.pdb
  output_prefix: ~/cluster/mp_results/
  name: 5h5s_new3
  ligand_residues: 164-177
  protein_residues: 1-163
  # bond: "377.N-390.C"


setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  eq:
    name: "eq"
    d: 0.9
    e: 0.9
    execute: True
    use_cpu: True

  pull:
    name: "pull"
    d: 0.9
    e: 0.9
    mode: "serial"
    stride: 1
    pull_intervals:
      - start: 5
        end: 7
        step: 1.00
        replica_scaling: 1
        k: 4.0
      - start: 8
        end: 10
        step: 0.50
        replica_scaling: 1
        k: 8.0

  us:
    name: us
    d: 0.9
    e: 0.9
    us_intervals:
      - start: 5
        end: 7
        step: 1
        replica_scaling: 1
        k: 4.0

      - start: 8
        end: 10
        step: 0.5
        replica_scaling: 1
        k: 8.0

  rs_remd:
    name: rs_remd
    n_rep: 16
    d: [0.00, 0.01, 0.02, 0.04, 0.08, 0.12, 0.16, 0.20, 0.24, 0.28, 0.32, 0.38, 0.44, 0.50, 0.58, 0.68]
    e: [1.00, 0.99, 0.98, 0.97, 0.96, 0.94, 0.92, 0.90, 0.88, 0.86, 0.84, 0.82, 0.80, 0.78, 0.76, 0.74]
    k: 8.0



