##################################################################
# Comment:
# RS-REMD for 1sfi with rep8 scaling. The com distance is calculated
# from scaled equilibrated structure. We now use a smaller box.
# we use 16 replicas in total and the force constant we used in usremd simulation.
##################################################################
tag: rep8_rsremd_sm_top8_16
test: False

cluster:
  exclude_ranks: [t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn026]

system:
  pdb: ~/master_project/input/pdb_files/1sfi/1sfi_cleaned.pdb
  output_prefix: ~/mp_results/
  name: 1sfi
  ligand_residues: 224-237
  protein_residues: 1-223
  bond: 224.N-237.C
  box_size: 12.5
setup:
  setup: True
  setup_type: cluster

methods:
  eq:
    name: "eq"
    d: [0.200]
    e: [0.900]
    execute: True
    use_cpu: True
    nstlim: 250000
    # Optional additional eq-stage mdin_eq runtime if templates/eq/mdin_eq is present.

  rs_remd:
    name: "rs_remd"
    n_rep: 16
    ngpu: 4

    constraint: "rtx4090|rtxa5000|rtx5090"

    eq_replica: 8

    nstlim_eq: 250000
    nstlim_eq_each: 250000
    nstlim: 250
    numexchg: 100000
    d: [ 0.000, 0.013, 0.027, 0.040, 0.053, 0.067, 0.080, 0.093, 0.107, 0.120, 0.133, 0.147, 0.160, 0.173, 0.187, 0.200 ]
    e: [ 1.000, 0.993, 0.987, 0.980, 0.973, 0.967, 0.960, 0.953, 0.947, 0.940, 0.933, 0.927, 0.920, 0.913, 0.907, 0.900 ]
    k: 12.0