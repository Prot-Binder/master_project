##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# running us-remd for the 1sfi system. From 13.00 to 27.00 using
# a spacing of 0.25 and force constant of k = 24. then from 27.75
# to 35.75 using a spacing of 1.00 and force constant of k = 4.0
# here we simulate another 50ns as we assumed that the first 50 ns did
# not reach covergence, at least regarding receptor rmsd in most cases.
##################################################################
tag: rep0_cnt
test: False

cluster:
  exclude_ranks: [t38cn054,t38cn035,t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045,t38cn042]

system:
  pdb: ~/master_project/input/pdb_files/1sfi/1sfi_cleaned.pdb
  output_prefix: ~/mp_results/
  name: 1sfi
  ligand_residues: 224-237
  protein_residues: 1-223
  bond: 224.N-237.C

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  us:
    name: "us"
    nstlim: 12500000
    d: [0.00]
    e: [1.00]
    continuation:
      enabled: True
      source_tag: rep0
    us_intervals:
      - start: 21.25
        end: 27.50
        step: 0.25
        k: 24.00
      - start: 27.75
        end: 35.75
        step: 1.00
        k: 4.0
