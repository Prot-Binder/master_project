##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# running us-remd for the 1sfi system. From 17.25 to 22.25 using
# a spacing of 0.25 and force constant k = 20. Previous runs with 20
# tasks failed
##################################################################
tag: rep0_xch_40ns2
test: False

cluster:
  exclude_ranks: [t38cn035,t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045]

system:
  pdb: ~/master_project/input/pdb_files/1sfi/1sfi_cleaned.pdb
  output_prefix: ~/mp_results/
  name: 1sfi
  ligand_residues: 224-237
  protein_residues: 1-223
  bond: 224.N-237.C

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  us_remd:
    name: "us_remd"
    
    ngpu: 4
    # ngpu: 1
    partition: "barracuda"
    constraint: "rtx4090|rtx5090|rtxa5000"
    # nodelist: "t38cn054"
    
    # Optional continuation from a previous tag.
    # If source_method is omitted, it defaults to the current method: us_remd.
    continuation:
      enabled: True
      source_tag: 1sfi_rep0_rst_p1
      source_method: us_remd  # or us_remd
    nstlim: 250
    numexchg: 40000
    d: [0.00]
    e: [1.00]
    us_remd_intervals:
      - windows: [16.00, 16.25, 16.50, 16.75, 17.00, 17.25, 17.50, 17.75, 18.00, 18.25, 18.50, 18.75, 19.00, 19.25, 19.50, 19.75, 20.00, 20.25, 20.50, 20.75, 21.00, 21.25, 21.50, 21.75, 22.00, 22.25, 22.50, 22.75, 23.00, 23.25, 23.50, 23.75]
        kappas: [ 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00]
