##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# running us-remd for the 1sfi system. from 21.0 to 22.25 using 8 windows in between
# we add some intermediate values to get better overlap and balance.
##################################################################
tag: rep0_usremd_res_b2
test: False

cluster:
  exclude_ranks: [t38cn035,t38cn030,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn026]

system:
  pdb: ~/master_project/input/pdb_files/1sfi/1sfi_cleaned.pdb
  output_prefix: ~/mp_results/
  name: 1sfi
  ligand_residues: 224-237
  protein_residues: 1-223
  bond: 224.N-237.C

setup:
  setup: False
  setup_dir: ~/mp_results/1sfi/rep0_usremd_40ns/us_remd/setup
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  us_remd:
    name: "us_remd"
    ngpu: 2
    # partition: "barracuda"
    constraint: "rtx4090|rtx5090|rtxa5000"
    # nodelist: "t38cn042"
    # Optional continuation from a previous tag.
    # If source_method is omitted, it defaults to the current method: us_remd.
    continuation:
      enabled: True
      source_tag: rep0_rst_1
      source_method: us_remd  # or us_remd
    nstlim: 250
    numexchg: 40000
    d: [0.00]
    e: [1.00]
    us_remd_intervals:
      - windows: [21.00, 21.25, 21.50, 21.75, 21.90, 22.00, 22.16, 22.25]
        kappas: [ 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00]