##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# running us-remd for the 1sfi system unscaled. 
# the overlap between 16.25 and 16.5, as well as between
# 16.75 and 17.00 is not high, so we like to 
# increase the sampling and overlap here. We introduced a new window each.
##################################################################
tag: rep0_usremd_short
test: False

cluster:
  exclude_ranks: [t38cn035,t38cn038,t38cn028,t38cn030,t38cn015,t38cn024,t38cn027,t38cn018,t38cn031,t38cn020,t38cn032,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045]

system:
  pdb: ~/master_project/input/pdb_files/1sfi/1sfi_cleaned.pdb
  output_prefix: ~/mp_results/
  name: 1sfi
  ligand_residues: 224-237
  protein_residues: 1-223
  bond: 224.N-237.C

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  us_remd:
    name: "us_remd"
    ngpu: 4
    # partition: "barracuda"
    # constraint: "rtx4090|rtx5090|rtxa5000"
    # nodelist: "t38cn030"
    # Optional continuation from a previous tag.
    # If source_method is omitted, it defaults to the current method: us_remd.
    continuation:
      enabled: True
      source_tag: rep0_tmp_rst
      source_method: us  # or us_remd
    nstlim: 250
    numexchg: 20000
    d: [0.000]
    e: [1.000]
    us_remd_intervals:
      - windows: [16.00, 16.25, 16.39, 16.50, 16.75, 16.85, 17.00, 17.25]
        kappas:  [24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00, 24.00]
