##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# running us-remd for the 1sfi system scaled (rep8).
# we now like to simulate approx. 80 ns over 2 days on a 5000 node (3 GPUs)
# from 30.00 to 35.50 in steps of 0.5 with k = 4.0.
##################################################################
tag: rep8_usremd_b3_final
test: False

cluster:
  exclude_ranks: [t38cn035,t38cn038,t38cn028,t38cn030,t38cn015,t38cn024,t38cn027,t38cn018,t38cn031,t38cn020,t38cn032,t38cn022,t38cn055,t38cn026,t38cn045]

system:
  pdb: ~/master_project/input/pdb_files/1sfi/1sfi_cleaned.pdb
  output_prefix: ~/mp_results/
  name: 1sfi
  ligand_residues: 224-237
  protein_residues: 1-223
  bond: 224.N-237.C

setup:
  setup: False # TODO: think of deleting this filed as it may be redundant
  setup_dir: ~/mp_results/1sfi/rep8_usxch20_2p2/us_remd/setup
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  us_remd:
    name: "us_remd"
    ngpu: 3
    # partition: "barracuda"
    # constraint: "rtx4090|rtx5090|rtxa5000"
    nodelist: "t38cn048"
    # Optional continuation from a previous tag.
    # If source_method is omitted, it defaults to the current method: us_remd.
    continuation:
      enabled: True
      source_tag: rep8_b3_rst2
      source_method: us_remd  # or us_remd
    nstlim: 250
    numexchg: 80000
    d: [0.200]
    e: [0.900]
    us_remd_intervals:
      - windows: [30.00, 30.50, 31.00, 31.50, 32.00, 32.50, 33.00, 33.50, 34.00, 34.50, 35.00, 35.50]
        kappas:  [04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00]
