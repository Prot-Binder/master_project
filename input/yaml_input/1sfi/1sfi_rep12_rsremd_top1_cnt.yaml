##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment: RS-REMD WITH AN ADDITIONAL SHORT EQUILIBRATION AT EACH SCALING.
# d = 0.380, e = 0.820; i.e. rep12; 8 replicas, equally spaced.
# here, we run the equilibration at the unscaled replica and
# then start the production rs-remd run from there.
##################################################################
tag: rep12_rs_top1_cnt
test: False

cluster:
  exclude_ranks: [] # [t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045,t38cn042]

system:
  pdb: ~/cluster/master_project/input/pdb_files/1sfi/1sfi_cleaned.pdb
  output_prefix: ~/cluster/mp_results/
  name: 1sfi
  ligand_residues: 224-237
  protein_residues: 1-223
  bond: 224.N-237.C


setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster

methods:
  rs_remd:
    name: "rs_remd"
    n_rep: 8
    ngpu: 1

    # Optional scheduler settings
    # nodelist: "t38cn035"
    # partition: "<partition>"
    # constraint: "<constraint>"

    # Optional: choose which replica/scaling would be used for the
    # initial single RS-REMD equilibration in non-restart mode.
    # In restart mode below, that equilibration is skipped anyway.
    restart:
      enabled: True
      path: ~/cluster/mp_results/1sfi/rep12_rs_top1/rs_remd/run_output/amber
    eq_replica: 1

    nstlim_eq: 250000
    nstlim_eq_each: 250000
    nstlim: 250
    numexchg: 16000
    d: [0.000, 0.054, 0.109, 0.163, 0.217, 0.271, 0.326, 0.380]
    e: [1.000, 0.974, 0.949, 0.923, 0.897, 0.871, 0.846, 0.820]
    k: 16.0
