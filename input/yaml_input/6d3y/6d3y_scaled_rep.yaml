##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# 6d3y simulation scaled PMF based on previous scaling studies.
# We selected  d = 0.320  and e = 0.840 to be ideal.
# we first perform pulling and subsequently like to perform us-remd simulation.
##################################################################
tag: repX
test: False

cluster:
  exclude_ranks: [t38cn035,t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn026,t38cn045,t38cn049]

system:
  pdb: ~/master_project/input/pdb_files/6d3y/6d3y.pdb
  output_prefix: ~/mp_results/
  name: 6d3y
  ligand_residues: 248-261
  protein_residues: 1-247

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  eq:
      name: "eq"
      d: [0.00]
      e: [1.00]
      execute: True
      use_cpu: True
      nstlim: 250000

  pull:
    name: "pull"
    d: [ 0.320 ]
    e: [ 0.840 ]
    mode: "serial"
    stride: 2
    nstlim: 350000
    pull_intervals:
    - start: 16.50
      end: 21.00
      step: 0.5
      k: 12.0
    - start: 21.25
      end: 35.50
      step: 0.75
      k: 4.0

  us_remd:
    name: "us_remd"
    ngpu: 4
    # partition: "barracuda"
    constraint: "rtx5090"
    nstlim: 250
    numexchg: 40000
    d: [ 0.320 ]
    e: [ 0.840 ]
    us_remd_intervals:
      - windows: [16.50, 17.00, 17.50, 18.00, 18.50, 19.00, 19.50, 20.00, 20.50, 21.00, 21.25, 22.00, 22.75, 23.50, 24.25, 25.00, 25.75, 26.50, 27.25, 28.00, 28.75, 29.50, 30.25, 31.00, 31.75, 32.50, 33.25, 34.00, 34.75, 35.50]
        kappas: [ 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 12.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00, 04.00]



