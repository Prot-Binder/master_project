##################################################################
# Describe what this run is all about.
# This helps your brain later (while writing your thesis).
# Comment:
# 6d3y simulation unscaled. We like to use it to further validate the
# restraint contribution comparison. Additionally, we do not have
# a scaling selection strategy yet. So we use the unscaled system for now.
##################################################################
tag: rep0
test: False

cluster:
  exclude_ranks: [t38cn035,t38cn030,t38cn038,t38cn028,t38cn015,t38cn024,t38cn027,t38cn016,t38cn018,t38cn031,t38cn020,t38cn021,t38cn032,t38cn019,t38cn022,t38cn055,t38cn026,t38cn053,t38cn045,t38cn049]

system:
  pdb: ~/master_project/input/pdb_files/6d3y/6d3y.pdb
  output_prefix: ~/mp_results/
  name: 6d3y
  ligand_residues: 248-261
  protein_residues: 1-247

setup:
  setup: True # TODO: think of deleting this filed as it may be redundant
  setup_type: cluster # cluster or local; i.e. tleap may not be available on the cluster
  # setup_dir: ~/cluster/master_project/results/5h5s_new/us/test_multi_k/setup # path to the setup directory where the new setup will be created; if it already exists, it will be overwritten

methods:
  us_remd:
    name: "us_remd"
    ngpu: 3
    # partition: "barracuda"
    constraint: "rtx4090|rtx5090|rtxa5000"
    nstlim: 250
    numexchg: 20000
    d: [ 0.00 ]
    e: [ 1.00 ]
    us_remd_intervals:
      - windows: [16.30, 16.60, 16.90, 17.20, 17.50, 17.80, 18.10, 18.40, 18.70, 19.00, 19.30, 19.60, 19.90, 20.20, 20.50, 20.80, 21.10, 21.40, 21.70, 22.00]
        kappas: [ 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00, 20.00]



